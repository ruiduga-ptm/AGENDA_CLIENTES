services:
  - type: web
    name: agenda-clientes-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SYNC_API_KEY
        sync: false
      - key: APP_SECRET
        sync: false
      - key: COOKIE_SECURE
        value: "1"
